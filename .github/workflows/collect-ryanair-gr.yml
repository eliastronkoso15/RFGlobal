name: Collect Ryanair Prices (SKG, ATH)

# Thessaloniki + Athens, Ryanair only, 6 months ahead (config/landings.mjs).
# Plain HTTPS (no browser): one job per landing, all 3 trip types in it (--type all),
# ~3-5 min wall each.
#
# Twice a day. Crons are set ~5.7 h EARLIER than the runs are wanted: GitHub starts
# scheduled runs 4.2-9.5 h late (median 5.7 h, 20 runs measured in Oct 2026), so
# '17 3' lands around ~09:00 UTC and '17 12' around ~18:00 UTC.

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch:

concurrency:
  group: collect-ryanair-gr
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        landing: [skg, ath]
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            eu-central-1   # not a secret — plain env
      SNAPSHOT_BUCKET:       ${{ secrets.SNAPSHOT_BUCKET }}
      TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
      COLLECT_NOTIFY:        'off'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Determine schedule tag
        id: schedule
        run: |
          HOUR=$(date -u +"%H")
          if [ "$HOUR" -lt "14" ]; then echo "tag=morning" >> "$GITHUB_OUTPUT"; else echo "tag=evening" >> "$GITHUB_OUTPUT"; fi

      - name: Collect all trip types (${{ matrix.landing }})
        run: node collect.mjs --provider ryanair_fare_finder --landing ${{ matrix.landing }} --schedule ${{ steps.schedule.outputs.tag }} --type all

      - name: Notify Telegram on workflow failure
        if: failure()
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"⚠️ <b>Ryanair ${{ matrix.landing }} workflow failed</b>\n<a href=\\\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\\\">View run</a>\",\"parse_mode\":\"HTML\",\"disable_web_page_preview\":true}"

  purge:
    name: Purge API cache
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    env:
      API_URL:            ${{ secrets.API_URL }}
      CACHE_PURGE_SECRET: ${{ secrets.CACHE_PURGE_SECRET }}
    steps:
      - name: POST /api/purge-cache
        run: |
          [ -z "$API_URL" ] && echo "API_URL not set — skipping purge" && exit 0
          curl -s -X POST "$API_URL/api/purge-cache" \
            -H "Authorization: Bearer $CACHE_PURGE_SECRET" \
            | grep -q '"ok":true' && echo "✅ Cache purged" || echo "⚠️ Purge failed (non-critical)"
