name: Collect Aegean Prices (EVN)

# Aegean from Yerevan: all three trip types daily, in ONE job (--type all).
# The provider fetches one price grid per process (12 destinations x 4 months,
# the last one for return legs only = 48 RouteLowFares calls, ~40 s) and builds
# oneway, weekend and holiday from it. Until 2026-11-07 each type was its own
# matrix job with its own grid (3 x 48 calls), so weekend ran Tue/Sat only to
# save calls; now it costs nothing extra and runs daily.
# NOTE: most Aegean EVN oneway fares exceed the €150 one-way ceiling, so the
# oneway snapshot holds few fares (4 on 2026-11-07) while the cheapest-per-day
# calendar (date-search hints) still fills.

# Cron is set ~5.7 h EARLIER than the run is wanted: measured over 20 runs (Oct 2026),
# GitHub starts these scheduled runs 4.2–9.5 h late (median 5.7 h) at any minute, so
# '31 4 * * *' lands around ~10:15 UTC, close to the AWS collectors (09:00 UTC).
# The API-side freshness window for GHA collectors (30h) absorbs the spread.

on:
  schedule:
    - cron: '31 4 * * *'
  workflow_dispatch:

concurrency:
  group: collect-aegean-evn
  cancel-in-progress: false

jobs:
  collect:
    # ubuntu-24.04 PINNED 2026-11-03: GitHub is rolling ubuntu-latest to 26.04
    # and Playwright errors 'does not support chromium on ubuntu26.04-x64'
    # (took the private repo's Aegean down for 7 days). Unpin only together
    # with a deliberate Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            eu-central-1   # not a secret — plain env
      SNAPSHOT_BUCKET:       ${{ secrets.SNAPSHOT_BUCKET }}
      TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
      COLLECT_NOTIFY:        'off'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - name: Determine schedule tag
        id: schedule
        run: |
          HOUR=$(date -u +"%H")
          if [ "$HOUR" -lt "14" ]; then echo "tag=morning" >> "$GITHUB_OUTPUT"; else echo "tag=evening" >> "$GITHUB_OUTPUT"; fi
      # A broken grid (>half the calls failed) fails all three types and exits 1;
      # yesterday's snapshots stay in place.
      - name: Collect all trip types (EVN)
        run: node collect.mjs --provider aegean_air --landing evn --schedule ${{ steps.schedule.outputs.tag }} --type all

      - name: Notify Telegram on workflow failure
        if: failure()
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"⚠️ <b>Aegean EVN workflow failed</b>\n<a href=\\\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\\\">View run</a>\",\"parse_mode\":\"HTML\",\"disable_web_page_preview\":true}"

  purge:
    name: Purge API cache
    needs: collect
    if: always()
    uses: ./.github/workflows/purge-cache.yml
    secrets: inherit
