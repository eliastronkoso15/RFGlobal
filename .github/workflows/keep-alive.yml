name: Keep-alive heartbeat

# GitHub disables scheduled workflows after 60 days without repository
# activity. Commits made with GITHUB_TOKEN count as activity, so a monthly
# heartbeat commit keeps the collect crons alive.

on:
  schedule:
    - cron: '19 3 1 * *'   # monthly, 1st day 03:19 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat
        run: |
          mkdir -p .github
          date -u +"%FT%TZ" > .github/heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat
          git commit -m "chore: heartbeat" || echo "nothing to commit"
          git push
